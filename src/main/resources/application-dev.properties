spring.application.name=marcador-mapa

#Recordá que las properties son las que tomará Spring Boot para configurar la app,
#En el caso de las variables de entorno configuradas en IntelliJ, permiten conectarse a la base de datos
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#El ddl está en validate ya que al usar Flyway, esto hace que si se cambia algo en las entidades, se valide si la migraciones tienen lo mismo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
